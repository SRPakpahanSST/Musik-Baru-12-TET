<!-- ====== BAGIAN PARTITUR NOTASI ANGKA ====== -->
<section id="partitur-section">
    <h2>Partitur Notasi Angka (Sistem 12-TET 20 Nada)</h2>
    
    <!-- Kontrol Nada Dasar, Skala, dan Akord -->
    <div class="partitur-controls">
        <label>Nada Dasar (20 Nada):</label>
        <select id="nada-dasar">
            <option value="E">E (Do Mayor)</option>
            <option value="E#">E#</option>
            <option value="F">F</option>
            <option value="F#">F#</option>
            <option value="G">G</option>
            <option value="G#">G#</option>
            <option value="H">H</option>
            <option value="H#">H#</option>
            <option value="I">I</option>
            <option value="J">J</option>
            <option value="J#">J#</option>
            <option value="K">K</option>
            <option value="K#">K#</option>
            <option value="A">A (Do Minor)</option>
            <option value="A#">A#</option>
            <option value="B">B</option>
            <option value="B#">B#</option>
            <option value="C">C</option>
            <option value="C#">C#</option>
            <option value="D">D</option>
        </select>

        <label>Skala:</label>
        <select id="mayor-minor">
            <option value="mayor">Mayor (E=1)</option>
            <option value="minor">Minor (A=1)</option>
        </select>

        <button id="tampilkan-akord">🎵 Tampilkan Akord</button>
        
        <label>Pilih Akord:</label>
        <select id="pilih-akord" disabled>
            <option value="">-- Pilih Akord --</option>
        </select>
    </div>

    <!-- Tombol Simbol Notasi (Diperbanyak) -->
    <div class="symbol-palette">
        <button onclick="insertSymbol('•')" title="Titik (staccato)">•</button>
        <button onclick="insertSymbol('••')" title="Dua titik">••</button>
        <button onclick="insertSymbol('|')" title="Garis birama">|</button>
        <button onclick="insertSymbol('/')" title="Slur / legato">/</button>
        <button onclick="insertSymbol('\\')" title="Slur terbalik">\</button>
        <button onclick="insertSymbol('0')" title="Nada diam (rest)">0</button>
        <button onclick="insertSymbol('♯')" title="Kruis (Sharp)">♯</button>
        <button onclick="insertSymbol('♭')" title="Mol (Flat)">♭</button>
        
        <!-- Simbol untuk Oktaf Tinggi (Garis 1 & 2) -->
        <button onclick="insertSymbol('‾')" title="Garis satu di atas (Oktaf tinggi)">‾</button>
        <button onclick="insertSymbol('‾‾')" title="Garis dua di atas (Oktaf paling tinggi)">‾‾</button>
        <button onclick="insertSymbol('•‾')" title="Titik dan garis satu">•‾</button>
        
        <!-- Simbol Tambahan -->
        <button onclick="insertSymbol('♩')" title="Not seperempat">♩</button>
        <button onclick="insertSymbol('♪')" title="Not seperdelapan">♪</button>
        <button onclick="insertSymbol('♫')" title="Not seperenam belas">♫</button>
        <button onclick="insertSymbol('𝄐')" title="Fermata">𝄐</button>
        <button onclick="insertSymbol('𝄆')" title="Repeat Awal">𝄆</button>
        <button onclick="insertSymbol('𝄇')" title="Repeat Akhir">𝄇</button>
        <button onclick="insertSymbol('𝄞')" title="Treble Clef">𝄞</button>
        <button onclick="insertSymbol('𝄢')" title="Bass Clef">𝄢</button>
    </div>

    <!-- Area Partitur -->
    <textarea id="partitur-area" placeholder="Tulis partitur notasi angka di sini..."></textarea>

    <!-- Tombol Aksi -->
    <div class="partitur-actions">
        <button onclick="simpanPartitur()">💾 Simpan</button>
        <button onclick="bukaPartitur()">📂 Buka</button>
        <button onclick="cetakPartitur()">🖨️ Cetak</button>
        <button onclick="bersihkanPartitur()">🗑️ Bersihkan</button>
    </div>

    <!-- Pesan Status -->
    <div id="status-message"></div>
</section>

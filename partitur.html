<!-- ====== BAGIAN PARTITUR NOTASI ANGKA ====== -->
<section id="partitur-section">
    <h2>Partitur Notasi Angka</h2>
    
    <div>
        <label>Nada Dasar:</label>
        <select id="nada-dasar">
            <option value="E">E</option>
            <option value="A">A</option>
        </select>

        <label>Skala:</label>
        <select id="mayor-minor">
            <option value="mayor">Mayor</option>
            <option value="minor">Minor</option>
        </select>

        <button id="tampilkan-akord">Tampilkan Akord</button>
        
        <select id="pilih-akord" disabled>
            <option value="">-- Pilih Akord --</option>
        </select>
    </div>

    <!-- Area Partitur (TANPA tombol simbol dulu) -->
    <textarea id="partitur-area" placeholder="Tulis partitur di sini..." style="width:100%; height:300px;"></textarea>

    <div style="margin-top:10px;">
        <button onclick="simpanPartitur()">Simpan</button>
        <button onclick="bukaPartitur()">Buka</button>
        <button onclick="cetakPartitur()">Cetak</button>
        <button onclick="bersihkanPartitur()">Bersihkan</button>
    </div>

    <div id="status-message"></div>
</section>
